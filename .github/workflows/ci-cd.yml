name: CI/CD

on:
  push:
    branches: ['preprod', 'prod']
  pull_request:
    branches: ['preprod', 'prod']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          npm config set fetch-retry-mintimeout 2000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check .

      - name: Run Tests
        run: npm run test

      - name: Build project
        run: npm run build

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Trigger Render Deploy Hook (preprod or prod)
        run: |
          if [[ "${GITHUB_REF##*/}" == "preprod" ]]; then
            curl -X POST "${{ secrets.RENDER_HOOK_URL_PREPROD }}"
          elif [[ "${GITHUB_REF##*/}" == "prod" ]]; then
            curl -X POST "${{ secrets.RENDER_HOOK_URL_PROD }}"
          else
            "Not a deployable branch. Skipping deployment."
          fi
